name: Build Play Store AAB
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Check secrets
        run: |
          for v in KEYSTORE_BASE64 KS_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!v}" ]; then echo "Secret missing: $v (Settings > Secrets and variables > Actions)"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: python3 -m pip install --break-system-packages pillow
      - name: Build (web files bundled inside the app)
        run: bash scripts/build_android.sh
        env:
          VERSION_CODE: ${{ github.run_number }}
          VT_TASK: bundleRelease
          VT_BG: "0"
          VT_BUNDLE: "1"
      - name: Sign AAB
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cp android/app/build/outputs/bundle/release/app-release.aab Snapme.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.jks -storepass "$KS_PASS" -keypass "$KEY_PASS" Snapme.aab "$KEY_ALIAS"
          jarsigner -verify Snapme.aab | tail -2
          rm release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: Snapme-aab
          path: Snapme.aab
