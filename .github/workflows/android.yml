name: Build APK (test)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VT_TASK: assembleDebug
      VT_BG: "1"
      VT_BUNDLE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: python3 -m pip install --break-system-packages pillow
      - name: Build (full build first, simpler fallbacks if needed)
        run: bash scripts/build_android.sh
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Snapme.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Snapme-apk
          path: Snapme.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Snapme APK 1.0.${{ github.run_number }}
          body_path: release-notes.md
          files: Snapme.apk
