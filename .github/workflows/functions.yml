name: Deploy push function (needs the Firebase Blaze plan)
# Run this once after you added the secret FIREBASE_SERVICE_ACCOUNT (the whole JSON key file of a Google service account
# that may deploy Cloud Functions). See README > "Push notifications".
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm --prefix functions install
      - name: Deploy
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then echo "Secret FIREBASE_SERVICE_ACCOUNT is missing (Settings > Secrets and variables > Actions)"; exit 1; fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools deploy --only functions --project vtext-506f7 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
